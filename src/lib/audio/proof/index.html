<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenSession — six-stem synchronization proof</title>
<style>
  body { font: 17px system-ui; max-width: 850px; margin: 48px auto; padding: 20px; }
  button[aria-pressed="true"] { background: #175aab; color: white; }
  td, th { padding: 6px 14px; text-align: left; }
  button { padding: 12px; margin: 6px; } pre { white-space: pre-wrap; }
</style>
<h1>Milestone 4: Mute / Solo</h1>
<p>Local engineering test. Start at low headphone volume.</p>
<button id="real">Load all 6 stems</button>
<button id="synthetic">Load synthetic pulses (not demo audio)</button>
<button id="play" disabled>Play / Resume</button>
<button id="pause" disabled>Pause</button>
<button id="stop" disabled>Stop</button>
<button id="verify">Verify sample alignment offline</button>
<p><output id="time">0.000 / 0.000 s</output></p>
<input id="seek" aria-label="Seek position" type="range" min="0" max="0" step="0.01" value="0" disabled style="width:100%">
<table><thead><tr><th>Track</th><th>Mute</th><th>Solo</th><th>Routing</th></tr></thead><tbody id="tracks"></tbody></table>
<pre id="status" role="status">Load all six stems before playing.</pre>
<script type="module">
  import { loadStaticStems, startSynchronizedStems, StemTransport } from '/engine.js';
  const stemNames = ['drums', 'bass', 'lead-guitar', 'rhythm-guitar-l', 'rhythm-guitar-r', 'vocals'];
  const $ = (id) => document.getElementById(id);
  let context, transport, loading = false, dragging = false;
  const log = (message) => { $('status').textContent = message; };
  let trackRows = [];
  function renderTracks(ids, labels) {
    $('tracks').replaceChildren();
    trackRows = ids.map((id, index) => {
      const row = document.createElement('tr');
      const name = document.createElement('td'); name.textContent = labels[index]; row.append(name);
      const buttons = ['Mute', 'Solo'].map(action => {
        const cell = document.createElement('td'), button = document.createElement('button');
        button.textContent = action; button.setAttribute('aria-label', `${action} ${labels[index]}`);
        button.onclick = () => {
          try {
            if (action === 'Mute') transport?.toggleMute(id); else transport?.toggleSolo(id);
            refresh();
          } catch (error) { log(error.message); }
        };
        cell.append(button); row.append(cell); return button;
      });
      const state = document.createElement('td'); row.append(state); $('tracks').append(row);
      return { id, buttons, state };
    });
  }
  async function unlock() {
    context ??= new AudioContext();
    await context.resume();
    if (context.state !== 'running') throw new Error('Audio context not running. Click again.');
  }
  function refresh() {
    const ready = !!transport && !loading;
    for (const id of ['play', 'pause', 'stop', 'seek']) $(id).disabled = !ready;
    const current = transport?.currentTime ?? 0;
    const duration = transport?.duration ?? 0;
    $('time').textContent = `${current.toFixed(3)} / ${duration.toFixed(3)} s — ${transport?.isPlaying ? 'Playing' : 'Paused / stopped'}`;
    $('seek').max = String(duration);
    if (!dragging) $('seek').value = String(current);
    const muted = transport?.mutedTrackIds ?? new Set(), soloed = transport?.soloTrackIds ?? new Set();
    for (const { id, buttons, state } of trackRows) {
      buttons.forEach(button => { button.disabled = !ready; });
      buttons[0].setAttribute('aria-pressed', String(muted.has(id)));
      buttons[1].setAttribute('aria-pressed', String(soloed.has(id)));
      state.textContent = muted.has(id) ? 'Muted' : soloed.size && !soloed.has(id) ? 'Excluded by Solo' : 'Enabled';
    }
  }
  function animate() { refresh(); requestAnimationFrame(animate); }
  requestAnimationFrame(animate);
  function pulses(ctx, channel) {
    const buffer = ctx.createBuffer(2, ctx.sampleRate * 8, ctx.sampleRate);
    const data = buffer.getChannelData(channel);
    for (let second = 0; second < 8; second++) {
      for (let i = 0; i < ctx.sampleRate * 0.03; i++) {
        data[second * ctx.sampleRate + i] = 0.15 * Math.sin(2 * Math.PI * 440 * i / ctx.sampleRate)
          * Math.exp(-i / (ctx.sampleRate * 0.005));
      }
    }
    return buffer;
  }
  async function load(synthetic) {
    loading = true;
    $('real').disabled = $('synthetic').disabled = true;
    transport?.dispose(); transport = undefined;
    renderTracks([], []);
    refresh();
    log(synthetic ? 'Loading test pulses…' : 'Loading and decoding all 6 stems…');
    try {
      await unlock();
      const loaded = synthetic ? [pulses(context, 0), pulses(context, 1)] : await loadStaticStems(context, stemNames.map(name => `/demo/stormhacks/audio/${name}.mp3`));
      const durations = loaded.map((buffer) => buffer.duration);
      const labels = synthetic ? ['Test left', 'Test right'] : stemNames;
      const details = durations.map((duration, index) => `${labels[index]}: ${duration.toFixed(4)} s`).join('\n');
      if (Math.max(...durations) - Math.min(...durations) > 0.05) {
        throw new Error(`Stem lengths differ by more than 50ms. Export the same time range.\n${details}`);
      }
      const ids = synthetic ? ['test-left', 'test-right'] : stemNames;
      transport = new StemTransport(context, loaded, ids);
      renderTracks(ids, synthetic ? labels : ['Drums', 'Bass', 'Lead Guitar', 'Rhythm Guitar L', 'Rhythm Guitar R', 'Vocals']);
      log(`${synthetic ? 'SYNTHETIC TEST ONLY' : 'All 6 stems'} ready.\n${details}`);
      refresh();
    } catch (error) { log(error.message); }
    finally { loading = false; $('real').disabled = $('synthetic').disabled = false; refresh(); }
  }
  $('real').onclick = () => load(false);
  $('synthetic').onclick = () => load(true);
  $('play').onclick = async () => {
    try { await transport?.play(); } catch (error) { log(error.message); }
    refresh();
  };
  $('pause').onclick = () => { transport?.pause(); refresh(); };
  $('stop').onclick = () => { transport?.stop(); refresh(); };
  $('seek').oninput = () => { dragging = true; };
  $('seek').onchange = async () => {
    const seconds = Number($('seek').value);
    dragging = false;
    try { await transport?.seek(seconds); } catch (error) { log(error.message); }
    refresh();
  };
  $('seek').onblur = () => { dragging = false; };
  $('verify').onclick = async () => {
    $('verify').disabled = true;
    try {
      const ctx = new OfflineAudioContext(6, 48000, 48000);
      const pair = [0, 1, 2, 3, 4, 5].map(channel => {
        const buffer = ctx.createBuffer(6, 24000, 48000);
        buffer.getChannelData(channel)[0] = 0.25;
        buffer.getChannelData(channel)[12000] = 0.25;
        return buffer;
      });
      startSynchronizedStems(ctx, pair);
      const rendered = await ctx.startRendering();
      const left = rendered.getChannelData(0), right = rendered.getChannelData(1);
      const first = left.findIndex(value => Math.abs(value) > 0.01);
      const matches = [right, ...[2, 3, 4, 5].map(channel => rendered.getChannelData(channel))]
        .every(data => left.every((value, index) => value === data[index]));
      if (!matches || first !== 2400 || left[14400] !== 0.25) throw new Error('FAIL: rendered samples differ or start time is wrong.');
      const seekContext = new OfflineAudioContext(6, 48000, 48000);
      startSynchronizedStems(seekContext, pair, 0.25, 0.25);
      const seekRendered = await seekContext.startRendering();
      const seekLeft = seekRendered.getChannelData(0), seekRight = seekRendered.getChannelData(1);
      if (seekLeft.findIndex(value => Math.abs(value) > 0.01) !== 2400 ||
          ![seekRight, ...[2, 3, 4, 5].map(channel => seekRendered.getChannelData(channel))]
            .every(data => seekLeft.every((value, index) => value === data[index]))) {
        throw new Error('FAIL: non-zero offset is not sample-aligned.');
      }
      log('PASS: native Web Audio sample alignment at offset 0 and offset 0.250s. All 6 stems start at sample 2400 (50ms). Real transport listening check still required.');
    } catch (error) { log(error.message); }
    finally { $('verify').disabled = false; }
  };
  window.addEventListener('pagehide', () => { transport?.dispose(); void context?.close(); });
</script>
</html>
